<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Light • I Am Light</title>
    <style>
        :root {
            --bg-deep: #4A0E17;
            --bg-glow: #7A1C2B;
            --gold-accent: #E5C158;
            --text-light: #F9F6F0;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-deep) 75%);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            width: 90%;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-org {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--gold-accent);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        /* Flickering Diya Styling */
        .diya-container {
            position: relative;
            width: 140px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .diya-flame {
            position: absolute;
            top: 8px;
            width: 26px;
            height: 42px;
            overflow: visible;
            filter: drop-shadow(0 0 6px rgba(255, 190, 70, 0.85)) drop-shadow(0 0 16px rgba(255, 110, 30, 0.45));
            animation: flicker 2.4s infinite alternate ease-in-out;
            transform-origin: bottom center;
            z-index: 2;
        }

        @keyframes flicker {
            0% { transform: scale(1, 1) rotate(-1deg); opacity: 0.96; }
            25% { transform: scale(0.98, 1.04) rotate(1deg); opacity: 1; }
            50% { transform: scale(1.01, 0.97) rotate(-1.5deg); opacity: 0.92; }
            75% { transform: scale(0.99, 1.03) rotate(1deg); opacity: 0.98; }
            100% { transform: scale(1, 1.01) rotate(0deg); opacity: 1; }
        }

        /* Respect people who ask for less motion */
        @media (prefers-reduced-motion: reduce) {
            .diya-flame { animation: none; }
            #card-display { animation: none; }
        }

        .diya-bowl {
            position: absolute;
            bottom: 10px;
            width: 110px;
            height: 40px;
            background: radial-gradient(circle at 50% 30%, #a32a36, #4a0e17);
            border-radius: 0 0 55px 55px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,189,57,0.3);
            border-top: 2px solid var(--gold-accent);
            z-index: 1;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            color: var(--gold-accent);
            margin: 0 0 0.5rem 0;
            letter-spacing: 1px;
        }

        .hindi-text {
            font-size: 1rem;
            color: var(--text-light);
            opacity: 0.85;
            margin-bottom: 1.2rem;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 2rem;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF8C42 0%, #E5C158 100%);
            border: none;
            border-radius: 30px;
            color: #2A080C;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
            margin-bottom: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(229, 193, 88, 0.4);
            border-radius: 30px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            margin-bottom: 1rem;
            transition: background 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .footer-info {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 1rem;
            line-height: 1.5;
        }

        /* In-page song player */
        .song-block {
            width: 100%;
        }

        .song-block .btn-secondary {
            display: block;
        }

        .song-player {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-bottom: 0.6rem;
            border-radius: 12px;
            overflow: hidden;
